<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IntoExistence — Legal</title>
<style>
  :root { --bg:#000; --surface:#121214; --border:#262628; --text:#fff; --muted:#a1a1a6; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card { max-width:420px; width:100%; text-align:center; }
  .brand { font-size:14px; letter-spacing:0.3px; color:var(--muted); margin:0 0 6px; }
  h1 { font-size:28px; letter-spacing:-0.5px; margin:0 0 28px; }
  a.link {
    display:block; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:16px 20px; margin:0 0 12px; color:var(--text);
    text-decoration:none; font-size:17px; font-weight:600;
  }
  a.link:hover { border-color:#3a3a3c; }
  .foot { color:#6e6e73; font-size:13px; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <p class="brand">IntoExistence</p>
    <h1>Legal</h1>
    <a class="link" href="privacy.html">Privacy Policy →</a>
    <a class="link" href="terms.html">Terms of Use →</a>
    <p class="foot">© <span id="yr"></span> Jack Holdway</p>
  </div>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
